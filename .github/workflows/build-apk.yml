name: Build & Release GameHub APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew || true

      - name: Build APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../GameHub.apk
            cd ..
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-APK
          path: |
            GameHub.apk
            public/GameHub.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GameHub.apk
            public/GameHub.apk
          name: GameHub ${{ github.ref_name }}
          body: |
            ## GameHub - Versão 1.0.0
            - Aplicativo Android nativo em Kotlin & Jetpack Compose
            - Identificador: `com.georgeisagi.gamehub`
            - Tela branca pura (#FFFFFF), sem botões e 100% offline.
            
            ### Download:
            Baixe o arquivo **GameHub.apk** abaixo e instale no seu celular Android.
          draft: false
          prerelease: false
